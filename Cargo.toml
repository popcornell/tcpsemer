[package]
name = "tcpsemer"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["abi3-py39"] }
rayon = "1.10"

[features]
extension-module = ["pyo3/extension-module"]

[profile.release]
lto = true
codegen-units = 1
