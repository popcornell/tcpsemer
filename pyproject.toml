[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tcpsemer"
version = "0.1.0"
description = "Time-constrained minimum-permutation semantic error rate (tcpSemER) for multi-speaker ASR"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "meeteval>=0.4",
    "simplejson",
    "sentence-transformers>=2.2",
    "torch",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
tcpsemer = "tcpsemer.cli:main"

[tool.setuptools]
packages = ["tcpsemer"]
