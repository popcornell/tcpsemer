[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "tcpsemer"
version = "0.1.0"
description = "Time-constrained minimum-permutation semantic error rate (tcpSemER) for multi-speaker ASR"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "meeteval>=0.4",
    "simplejson",
    "sentence-transformers>=2.2",
    "torch",
]

[project.optional-dependencies]
test = ["pytest", "scipy"]

[project.scripts]
tcpsemer = "tcpsemer.cli:main"

[tool.maturin]
module-name = "tcpsemer._rust"
features = ["extension-module"]
python-source = "."
python-packages = ["tcpsemer"]
include = [{ path = "tcpsemer/**/*.py", format = "sdist" }]
